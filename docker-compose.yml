version: '3.8'

services:
  scanner:
    build: .
    container_name: uniden-web-remote
    restart: unless-stopped

    ports:
      - "3000:3000"

    devices:
      # BCT15X USB Serial Port
      # Note: Device path may differ depending on your host environment
      # Verify with `ls /dev/ttyUSB*` or `dmesg | grep tty`
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      # ALSA sound device (for audio streaming & recording)
      - "/dev/snd:/dev/snd"

    volumes:
      # Persistent storage for audio recordings
      - ./recordings:/app/recordings
      # Persistent storage for config and backups
      - ./config:/app/config

    environment:
      # Serial port configuration
      - SERIAL_PORT=/dev/ttyUSB0
      - SERIAL_BAUD=115200

      # Audio device configuration
      # Check available devices with `arecord -l`
      # Example: plughw:1,0 (USB Audio Adapter), plughw:0,0 (Built-in Audio)
      - AUDIO_DEVICE=plughw:1,0

      # Audio recording settings
      - AUDIO_FORMAT=mp3
      - AUDIO_SAMPLE_RATE=22050
      - AUDIO_CHANNELS=1
      - AUDIO_BITRATE=64
      - AUTO_RECORD=true

      # Filename template
      - FILENAME_TEMPLATE={date}_{time}_{freq}_{system}_{channel}

      # Scanner polling settings
      - POLL_INTERVAL=200
      - RECEPTION_TIMEOUT=1500

      # Timezone
      - TZ=Asia/Tokyo

      # Mock mode (set to true for UI development without physical hardware)
      - MOCK_MODE=false

    # Add container to audio and dialout groups for device permissions
    group_add:
      - audio
      - dialout

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
