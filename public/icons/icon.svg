<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Outer Rim Accent -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />

  <!-- Radio Antenna Tower & Waves -->
  <!-- Antenna Rod -->
  <line x1="256" y1="90" x2="256" y2="240" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="84" r="14" fill="#38bdf8" filter="url(#glow)" />

  <!-- Signal Waves Left -->
  <path d="M 216 110 A 50 50 0 0 0 216 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 180 80 A 90 90 0 0 0 180 220" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.5" />
  <path d="M 144 50 A 130 130 0 0 0 144 250" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.25" />

  <!-- Signal Waves Right -->
  <path d="M 296 110 A 50 50 0 0 1 296 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 332 80 A 90 90 0 0 1 332 220" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.5" />
  <path d="M 368 50 A 130 130 0 0 1 368 250" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.25" />

  <!-- Mini Scanner Display Window -->
  <rect x="76" y="260" width="360" height="150" rx="16" fill="url(#lcdGrad)" stroke="#0284c7" stroke-width="4" />
  
  <!-- Frequency Display Text -->
  <text x="256" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-weight="800" font-size="38" fill="#38bdf8" letter-spacing="2">
    155.7000
  </text>
  <text x="390" y="315" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#7dd3fc">
    MHz
  </text>

  <!-- Channel Name Text -->
  <text x="256" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#e0f2fe" letter-spacing="1">
    DISPATCH / AUTO
  </text>

  <!-- Signal Meter Bar -->
  <g transform="translate(100, 376)">
    <rect x="0" y="0" width="24" height="12" rx="3" fill="#38bdf8" />
    <rect x="32" y="0" width="24" height="12" rx="3" fill="#38bdf8" />
    <rect x="64" y="0" width="24" height="12" rx="3" fill="#38bdf8" />
    <rect x="96" y="0" width="24" height="12" rx="3" fill="#38bdf8" />
    <rect x="128" y="0" width="24" height="12" rx="3" fill="#38bdf8" />
    <rect x="160" y="0" width="24" height="12" rx="3" fill="#38bdf8" opacity="0.4" />
    <rect x="192" y="0" width="24" height="12" rx="3" fill="#38bdf8" opacity="0.2" />
    <text x="300" y="11" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#38bdf8">
      P25 / FM
    </text>
  </g>

  <!-- Bottom Badge: BCT15X REMOTE -->
  <rect x="156" y="434" width="200" height="34" rx="17" fill="#0369a1" />
  <text x="256" y="457" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="1.5">
    BCT15X REMOTE
  </text>
</svg>
